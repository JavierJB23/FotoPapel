name: Crear EXE de Revelo

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  generar-exe:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar componentes gratuitos
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Probar funciones principales
        shell: pwsh
        run: |
          python -m pip install pytest
          python -m pytest -q
      - name: Compilar Revelo.exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Revelo --icon icono.ico --add-data "icono.ico;." --add-data "logo_cabecera.png;." --collect-submodules PIL --collect-submodules reportlab --collect-all pypdfium2 --collect-all pillow_heif --collect-all qrcode main.py
      - name: Publicar EXE descargable
        uses: actions/upload-artifact@v4
        with:
          name: Revelo-Windows-EXE
          path: dist/Revelo.exe
          if-no-files-found: error
          retention-days: 30
