name: Crear Revelo para Windows (carpeta)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  generar-exe:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar componentes gratuitos
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Probar funciones principales
        shell: pwsh
        run: |
          python -m pip install pytest
          python -m pytest -q
      - name: Compilar Revelo en carpeta
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name Revelo --icon icono.ico --add-data "icono.ico;." --add-data "logo_cabecera.png;." --collect-submodules PIL --collect-submodules reportlab --collect-all pypdfium2 --collect-all pillow_heif --collect-all qrcode --collect-all pypdf --collect-all tkinterdnd2 main.py
          if (-not (Test-Path 'dist/Revelo/Revelo.exe')) { throw 'No se encontro Revelo.exe' }
          Get-FileHash 'dist/Revelo/Revelo.exe' -Algorithm SHA256 | Format-List
      - name: Publicar carpeta de Revelo descargable
        uses: actions/upload-artifact@v4
        with:
          name: Revelo-Windows-CARPETA
          path: dist/Revelo/
          if-no-files-found: error
          retention-days: 30
